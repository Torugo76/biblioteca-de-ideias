[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biblioteca-de-ideias"
version = "0.4.0"
description = "Quadro Kanban local para organizar ideias em Markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8", "PyYAML>=6.0"]

[project.scripts]
biblioteca-de-ideias = "biblioteca_ideias.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biblioteca_ideias = ["qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

